project_name: throtate_two_dataset_comparison
protocol_version: 1.0
protocol:
  token: THROTATE_MULTIDATASET_COMPARISON_V1
  pykeen_version: 1.11.1
  validation_only_parameter_selection: true
  no_test_parameter_selection: true
  filtered_evaluation: true
  both_side_ranking: true
  dataset_isolated_outputs: true
  cache_requires_full_experiment_fingerprint: true
model:
  embedding_dim: 200
  transh_norm: 2
  transh_power_norm: false
  rotate_norm: 2
training:
  loss: NSSA
  gamma: 3.0
  adversarial_temperature: 1.0
  optimizer: Adam
  learning_rate: 0.001
  max_steps: 3000
  batch_size: 1024
  num_negatives: 64
  evaluation_batch_size: 10
  negative_sampler_filtered: false
  drop_last: true
  device: auto
validation_search:
  baseline_seed: 42
  baseline_gamma_candidates:
  - 3.0
  - 6.0
  - 12.0
  - 24.0
  d2_delta_candidates_radians:
  - 0.05
  - 0.1
  - 0.15
  d2_delta_seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  primary_metric: mrr
  secondary_metric: hits_at_1
  tie_break: smaller_parameter
formal:
  models:
  - TransH
  - RotatE
  - D0
  - D1
  - A0
  - D2
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
output:
  directory: results/multidataset_comparison
datasets:
